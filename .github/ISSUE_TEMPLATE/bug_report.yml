name: Bug report
description: Something isn't working, or an adapter stopped exporting
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: app
    attributes:
      label: Meeting app
      options:
        - Fireflies.ai
        - Other (say which below)
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you click, and what did you get instead of the export?
      placeholder: Clicked "Download Markdown" on a meeting page and got "No transcript found".
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 140, Brave 1.82, Edge 140...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension version
      description: Shown on chrome://extensions or in manifest.json
      placeholder: 1.3.0
  - type: textarea
    id: console
    attributes:
      label: Console output
      description: Right-click the popup, choose Inspect, open the Console tab and paste any errors.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I removed names, emails and other private details from anything pasted above
          required: true
