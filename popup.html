<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="card" id="app" data-mood="idle">
    <header class="top">
      <svg class="mascot" viewBox="0 0 128 128" aria-hidden="true">
        <g class="sheet">
          <g transform="rotate(14 86 40)">
            <rect x="62" y="8" width="46" height="60" rx="7" fill="#fff" stroke="#2A1B3D" stroke-width="6"/>
            <path d="M72 24 H98 M72 36 H92 M72 48 H96" stroke="#FF6B8A" stroke-width="5" stroke-linecap="round"/>
          </g>
        </g>
        <g class="body">
          <path d="M40 36 H78 A26 26 0 0 1 104 62 V74 A26 26 0 0 1 78 100 H48 L26 118 L32 98 A26 26 0 0 1 14 74 V62 A26 26 0 0 1 40 36 Z"
                fill="#FFB800" stroke="#2A1B3D" stroke-width="6" stroke-linejoin="round"/>
          <circle cx="35" cy="78" r="5" fill="#FF6B8A" opacity=".8"/>
          <circle cx="83" cy="78" r="5" fill="#FF6B8A" opacity=".8"/>
          <g class="eyes eyes-open">
            <circle cx="45" cy="64" r="6" fill="#2A1B3D"/>
            <circle cx="73" cy="64" r="6" fill="#2A1B3D"/>
          </g>
          <g class="eyes eyes-happy" fill="none" stroke="#2A1B3D" stroke-width="5" stroke-linecap="round">
            <path d="M39 66 Q45 58 51 66"/><path d="M67 66 Q73 58 79 66"/>
          </g>
          <g class="eyes eyes-busy">
            <circle cx="49" cy="62" r="6" fill="#2A1B3D"/>
            <circle cx="77" cy="62" r="6" fill="#2A1B3D"/>
          </g>
          <path class="mouth mouth-smile" d="M49 79 Q59 89 69 79" fill="none" stroke="#2A1B3D" stroke-width="5" stroke-linecap="round"/>
          <circle class="mouth mouth-o" cx="59" cy="82" r="5" fill="#2A1B3D"/>
          <path class="mouth mouth-wobble" d="M47 84 Q53 78 59 84 Q65 90 71 84" fill="none" stroke="#2A1B3D" stroke-width="5" stroke-linecap="round"/>
        </g>
      </svg>
      <div>
        <h1>Transcript Exporter</h1>
        <p class="site" id="site">Looking around…</p>
      </div>
    </header>

    <section class="level" aria-label="Your progress">
      <div class="level-row">
        <strong id="level-title">Note Newbie</strong>
        <span class="streak" id="streak" hidden></span>
      </div>
      <div class="bar" id="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <span class="bar-fill" id="bar-fill"></span>
      </div>
      <div class="level-sub">
        <span id="level-num">Level 1</span>
        <span id="xp-text">0 / 50 XP</span>
      </div>
    </section>

    <label class="switch">
      <input type="checkbox" id="merge" checked>
      <span class="track"><span class="knob"></span></span>
      <span>Merge back-to-back lines from the same person</span>
    </label>

    <div class="main-wrap">
      <button class="btn btn-main" id="md">Download Markdown</button>
      <span class="xp-float" id="xp-float" aria-hidden="true"></span>
    </div>
    <div class="row">
      <button class="btn" id="txt">Download .txt</button>
      <button class="btn" id="copy">Copy</button>
    </div>

    <p class="status" id="status" role="status" aria-live="polite">Open a meeting with its transcript showing.</p>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <details class="trophies">
      <summary>Badges <span class="count" id="badge-count">0 / 12</span></summary>
      <ul class="badges" id="badges"></ul>
      <p class="totals" id="totals"></p>
      <button class="reset" id="reset" type="button">Reset progress</button>
    </details>
  </main>
  <script src="game.js"></script>
  <script src="popup.js"></script>
</body>
</html>
